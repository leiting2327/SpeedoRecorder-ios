name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 与 SDK 版本
        run: |
          xcodebuild -version
          echo "--- iOS SDK ---"
          xcodebuild -showsdks | grep -i iphoneos

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 读取版本号
        id: ver
        run: |
          MARKETING=$(grep -m1 'MARKETING_VERSION:' project.yml | awk '{print $2}')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | awk '{print $2}')
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "版本：$MARKETING ($BUILD)"

      - name: 编译（无签名）
        run: |
          xcodebuild \
            -project SpeedoRecorder.xcodeproj \
            -scheme SpeedoRecorder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 打包 IPA（文件名带版本号）
        id: package
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "打包：$APP"
          rm -rf Payload SpeedoRecorder.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          VERSION="${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}"
          IPA="SpeedoRecorder-${VERSION}-unsigned.ipa"
          zip -r "$IPA" Payload
          echo "ipa_name=$IPA" >> "$GITHUB_OUTPUT"
          ls -la "$IPA"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error

      - name: 发布 Release 并附带 IPA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}"
          TAG="v${VERSION}"
          gh release create "$TAG" "${{ steps.package.outputs.ipa_name }}" \
            --title "车速Recorder IPA（未签名）${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }})" \
            --notes "未签名 IPA：需用 Sideloadly / AltStore / 爱思助手 以你的 Apple ID 重签名后安装。iOS 17+。功能：实时车速、GPS 信号强度、轨迹记录、行程视频录制（画面烧录车速/GPS/位置/里程/海拔/航向）、高德/百度地图接口可选、CSV/JSON 导出。" || true
