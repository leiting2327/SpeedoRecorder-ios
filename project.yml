name: SpeedoRecorder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0.1

targets:
  SpeedoRecorder:
    type: application
    platform: iOS
    sources:
      - path: SpeedoRecorder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SpeedoRecorder
        PRODUCT_NAME: SpeedoRecorder
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SpeedoRecorder/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpeedoRecorder/SpeedoRecorder.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 车速记录仪

schemes:
  SpeedoRecorder:
    build:
      targets:
        SpeedoRecorder: all
    run:
      config: Release
    archive:
      config: Release
